<nav
  class="sticky top-0 z-50 border-b border-main-color/10 bg-second-color/95 py-1 shadow-sm backdrop-blur-md"
>
  <div class="container mx-auto px-4">
    <div class="flex h-16 items-center justify-between">
      <!-- ========== LOGO ========== -->
      <a routerLink="/feed" class="group flex items-center gap-2">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-third-color/20 shadow-sm transition-all duration-200 group-hover:scale-105"
        >
          <img
            src="/assets/images/icons8-s-100.png"
            alt="Socia app logo"
            class="h-8 w-8 object-contain"
          />
        </div>

        <span class="hidden text-2xl font-extrabold tracking-tight text-slate-800 sm:block">
          Socia
          <span class="text-main-color">Posts</span>
        </span>
      </a>

      <!-- ========== NAVBAR LINKS ========== -->
      <div class="hidden items-center gap-2 md:flex">
        <!-- Feed -->
        <a
          routerLink="/feed"
          routerLinkActive="bg-third-color text-second-color shadow-md shadow-main-color/20"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold text-main-color transition-all duration-200 hover:-translate-y-0.5 hover:bg-third-color/20"
        >
          <i class="fa-regular fa-house text-base"></i>
          <span>Feed</span>
        </a>

        <!-- Profile -->
        <a
          routerLink="/profile"
          routerLinkActive="bg-third-color text-second-color shadow-md shadow-main-color/20"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold text-main-color transition-all duration-200 hover:-translate-y-0.5 hover:bg-third-color/20"
        >
          <i class="fa-solid fa-user text-base"></i>
          <span>Profile</span>
        </a>

        <!-- Notifications -->
        <a
          routerLink="/notifications"
          routerLinkActive="bg-third-color text-second-color shadow-md shadow-main-color/20"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold text-main-color transition-all duration-200 hover:-translate-y-0.5 hover:bg-third-color/20"
        >
          <i class="fa-regular fa-comment text-base"></i>
          <span>Notifications</span>
        </a>
      </div>

      <!-- ========== RIGHT SIDE ========== -->
      <div class="flex items-center gap-3">
        <!-- Profile Dropdown -->
        <div class="profile-dropdown relative">
          <!-- Profile Button -->
          <button
            type="button"
            (click)="toggleDropDown()"
            class="group flex items-center gap-2 rounded-xl p-1.5 transition-all duration-200 hover:bg-third-color/10"
          >
            <!-- Profile Image -->
            <img
              [src]="UserData.photo"
              [alt]="UserData.name"
              class="h-10 w-10 rounded-full border-2 border-third-color object-cover shadow-sm transition-transform duration-200 group-hover:scale-105"
            />

            <!-- User Info -->
            <div class="hidden flex-col text-left sm:flex">
              <strong class="text-sm font-extrabold text-slate-800">
                {{ UserData.name }}
              </strong>

              <span class="text-xs font-semibold text-main-color"> Admin </span>
            </div>

            <!-- Arrow -->
            <i
              class="fas fa-chevron-down hidden cursor-pointer text-xs text-main-color transition-transform duration-200 sm:block"
              [class.rotate-180]="isDropDownOpen"
            ></i>
          </button>

          <!-- ========== DROPDOWN MENU ========== -->
          @if (isDropDownOpen) {
            <div
              class="absolute right-0 top-full z-50 mt-3 w-64 overflow-hidden rounded-2xl border border-main-color/10 bg-second-color p-2 shadow-xl"
            >
              <!-- User Info -->
              <div class="rounded-xl bg-third-color/10 px-3 py-3">
                <p class="font-extrabold text-slate-800">
                  {{ UserData.username }}
                </p>

                <p class="mt-0.5 truncate text-xs font-medium text-slate-500">
                  {{ UserData.email }}
                </p>
              </div>

              <!-- Change Password -->
              <a
                routerLink="changePassword"
                (click)="dropDownClose()"
                class="mt-2 flex w-full cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-700 transition-all duration-200 hover:bg-third-color/15 hover:text-main-color"
              >
                <i class="fas fa-key w-4 text-main-color"></i>

                Change Password
              </a>

              <!-- Divider -->
              <div class="my-2 border-t border-main-color/10"></div>

              <!-- Logout -->
              <button
                type="button"
                (click)="logOut()"
                (click)="dropDownClose()"
                class="flex w-full cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-bold text-rose-600 transition-all duration-200 hover:bg-rose-50"
              >
                <i class="fas fa-right-from-bracket w-4"></i>

                Logout
              </button>
            </div>
          }
        </div>

        <!-- ========== MOBILE MENU BUTTON ========== -->
        <button
          (click)="toggleDropDownMobileMenu()"
          type="button"
          class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl text-main-color transition-all duration-200 hover:bg-third-color/15 md:hidden"
        >
          @if (isMobileMenuOpen) {
            <i class="fas fa-xmark text-lg"></i>
          } @else {
            <i class="fas fa-bars text-lg"></i>
          }
        </button>
      </div>
    </div>

    <!-- ========== MOBILE MENU ========== -->
    @if (isMobileMenuOpen) {
      <div
        class="mb-2 mt-2 flex flex-col gap-1 rounded-2xl border border-main-color/10 bg-second-color p-2 shadow-md md:hidden"
      >
        <!-- Feed -->
        <a
          routerLink="/feed"
          routerLinkActive="bg-third-color text-second-color shadow-md shadow-main-color/20"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="isMobileMenuOpen = false"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold text-main-color transition-all duration-200 hover:bg-third-color/15"
        >
          <i class="fa-regular fa-house w-5 text-center"></i>
          <span>Feed</span>
        </a>

        <!-- Profile -->
        <a
          routerLink="/profile"
          routerLinkActive="bg-third-color text-second-color shadow-md shadow-main-color/20"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="isMobileMenuOpen = false"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold text-main-color transition-all duration-200 hover:bg-third-color/15"
        >
          <i class="fa-solid fa-user w-5 text-center"></i>
          <span>Profile</span>
        </a>

        <!-- Notifications -->
        <a
          routerLink="/notifications"
          routerLinkActive="bg-third-color text-second-color shadow-md shadow-main-color/20"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="isMobileMenuOpen = false"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold text-main-color transition-all duration-200 hover:bg-third-color/15"
        >
          <i class="fa-regular fa-comment w-5 text-center"></i>
          <span>Notifications</span>
        </a>
      </div>
    }
  </div>
</nav>
