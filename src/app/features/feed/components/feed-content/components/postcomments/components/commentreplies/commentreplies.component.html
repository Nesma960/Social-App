<div class="mt-2 ml-10 border-l border-main-color/10 pl-3">
  <!-- Replies -->
  <div class="space-y-3">
    @for (reply of commentReplies(); track reply._id) {
      <div class="flex items-start gap-2 group">
        <!-- Avatar -->
        <img
          [src]="reply.commentCreator.photo"
          [alt]="reply.commentCreator.name"
          class="mt-0.5 h-7 w-7 shrink-0 rounded-full object-cover border border-main-color/10"
        />

        <div class="min-w-0">
          <!-- Reply Bubble -->
          <div
            class="inline-block max-w-[min(100%,420px)] rounded-2xl rounded-tl-md bg-slate-100 px-3 py-2"
          >
            <!-- Name -->
            <p class="text-[12px] font-bold text-main-color">
              {{ reply.commentCreator.name }}
            </p>

            <!-- Username + Time -->
            <div class="mt-0.5 flex items-center gap-1 text-2xs text-slate-400">
              <span>@{{ reply.commentCreator.username }}</span>
              <span>·</span>
              <span>
                {{ reply.createdAt | date: 'shortTime' }}
              </span>
            </div>

            <!-- Content -->
            <p
              class="mt-1 whitespace-pre-wrap wrap-break-word text-[12px] leading-relaxed text-slate-700"
            >
              {{ reply.content }}
            </p>
            @if (reply.image) {
              <img
                [src]="reply.image"
                [alt]="reply.commentCreator.name"
                class="mt-2 max-h-60 max-w-full rounded-xl object-cover"
              />
            }
          </div>

          <!-- Actions -->
          <div class="ml-2 mt-1 flex items-center gap-3 text-2xs font-semibold text-slate-400">
            <button type="button" class="transition-colors hover:text-main-color">
              Like ({{ reply.likes.length }})
            </button>

            <button type="button" class="transition-colors hover:text-main-color">Reply</button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="py-1 text-xs font-medium text-slate-400">No replies yet.</p>
    }
  </div>

  <!-- Reply Input -->
  <form class="mt-3" (submit)="submitReply($event, form)" #form>
    <div class="flex items-start gap-2">
      <!-- Current User -->
      <img
        src="/assets/images/images.jfif"
        alt="Profile photo"
        class="mt-0.5 h-7 w-7 shrink-0 rounded-full object-cover border border-main-color/10"
      />

      <!-- Input -->
      <div
        class="flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-2.5 py-1.5 transition-all duration-200 focus-within:border-third-color focus-within:bg-white focus-within:ring-2 focus-within:ring-main-color/10"
      >
        <textarea
          [formControl]="contentControl"
          rows="1"
          placeholder="Write a reply..."
          class="max-h-24 min-h-8 w-full resize-none border-0 bg-transparent px-1.5 py-1 text-xs text-slate-700 outline-none focus:ring-0 placeholder:text-slate-400"
        ></textarea>
        @if (imgUrl) {
          <div class="relative mb-2 w-fit">
            <img
              [src]="imgUrl"
              alt="Selected image"
              class="max-h-32 max-w-48 rounded-xl object-cover border border-main-color/10"
            />

            <button
              type="button"
              (click)="removeFile()"
              class="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full bg-slate-800 text-white shadow-md hover:bg-red-500"
            >
              <i class="fa-solid fa-xmark text-2xs"></i>
            </button>
          </div>
        }

        <!-- Bottom -->
        <div class="flex items-center justify-between">
          <!-- Attachment -->
          <label
            class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-full text-slate-400 transition-colors hover:bg-third-color/15 hover:text-main-color"
          >
            <i class="fa-regular fa-image text-xs"></i>

            <input
              #fileInput
              type="file"
              accept="image/*"
              class="hidden"
              (change)="changeFile($event)"
            />
          </label>

          <!-- Send -->
          <button
            type="submit"
            [disabled]="!contentControl.value?.trim() && !selectedFile"
            class="flex h-7 w-7 items-center justify-center cursor-pointer rounded-full bg-main-color text-white transition-all duration-200 hover:bg-third-color disabled:cursor-not-allowed disabled:bg-main-color/20"
          >
            <i class="fa-solid fa-paper-plane text-2xs"></i>
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
