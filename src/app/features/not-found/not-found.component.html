<section class="relative min-h-[calc(100vh-80px)] overflow-hidden bg-main-color/5">
  <!-- Decorative Background -->
  <div class="absolute -left-32 -top-32 h-80 w-80 rounded-full bg-third-color/10 blur-3xl"></div>

  <div class="absolute -bottom-40 -right-32 h-96 w-96 rounded-full bg-main-color/10 blur-3xl"></div>

  <!-- Small floating circles -->
  <div class="absolute left-[8%] top-[25%] h-3 w-3 rounded-full bg-third-color/40"></div>

  <div class="absolute right-[12%] top-[20%] h-5 w-5 rounded-full bg-main-color/20"></div>

  <div class="absolute bottom-[20%] left-[15%] h-4 w-4 rounded-full bg-third-color/30"></div>

  <!-- Main Content -->
  <div
    class="relative z-10 mx-auto flex min-h-[calc(100vh-80px)] max-w-7xl items-center px-5 py-12"
  >
    <div class="grid w-full items-center gap-12 lg:grid-cols-2 lg:gap-20">
      <!-- ================= LEFT ================= -->
      <div class="text-center lg:text-left">
        <!-- 404 -->
        <div class="relative inline-block">
          <h1
            class="text-[130px] font-black leading-none tracking-[-0.08em] text-main-color sm:text-[170px]"
          >
            404
          </h1>

          <!-- tiny badge -->
          <span
            class="absolute -right-3 top-5 rotate-6 rounded-full bg-main-color px-3 py-1 text-xs font-bold text-white shadow-lg shadow-main-color/20"
          >
            Oops!
          </span>
        </div>

        <!-- Heading -->
        <h2 class="mt-2 text-3xl font-bold text-gray-800 sm:text-4xl">
          Lost in the Socia universe?
        </h2>

        <!-- Description -->
        <p class="mx-auto mt-4 max-w-lg text-base leading-7 text-gray-500 lg:mx-0">
          Looks like this page decided to disappear from your feed. Don't worry, your posts are
          still waiting for you.
        </p>

        <!-- Buttons -->
        <div class="mt-8 flex flex-col items-center gap-3 sm:flex-row lg:items-start">
          <!-- Home -->
          <a
            routerLink="/"
            class="cursor-pointer group inline-flex items-center justify-center gap-2 rounded-xl bg-main-color px-6 py-3 font-semibold text-white shadow-lg shadow-main-color/20 transition duration-300 hover:-translate-y-1 hover:bg-main-color/90"
          >
            <i
              class="fa-solid fa-house text-sm transition-transform duration-300 group-hover:-translate-x-1"
            ></i>

            Back to Home
          </a>

          <!-- Feed -->
          <a
            routerLink="/feed"
            class="cursor-pointer inline-flex items-center justify-center gap-2 rounded-xl border border-main-color/20 bg-white px-6 py-3 font-semibold text-main-color transition duration-300 hover:-translate-y-1 hover:bg-main-color/5"
          >
            <i class="fa-solid fa-newspaper text-sm"></i>

            Explore Feed
          </a>
        </div>

        <!-- Small message -->
        <div
          class="mt-7 flex items-center justify-center gap-2 text-sm text-gray-400 lg:justify-start"
        >
          <span
            class="flex h-7 w-7 items-center justify-center rounded-full bg-main-color/10 text-main-color"
          >
            <i class="fa-solid fa-link-slash text-xs"></i>
          </span>

          <span>The page you're looking for doesn't exist.</span>
        </div>
      </div>

      <!-- ================= RIGHT ================= -->
      <div class="relative flex items-center justify-center">
        <!-- Large soft blob -->
        <div
          class="absolute h-82.5 w-82.5 rounded-full bg-third-color/10 blur-2xl sm:h-105 sm:w-105"
        ></div>

        <!-- Floating notification -->
        <div
          class="notification-float absolute right-0 top-4 z-20 hidden rounded-2xl border border-main-color/10 bg-white p-4 shadow-xl shadow-main-color/10 sm:block"
        >
          <div class="flex items-center gap-3">
            <div
              class="flex h-10 w-10 items-center justify-center rounded-full bg-main-color/10 text-main-color"
            >
              <i class="fa-solid fa-bell"></i>
            </div>

            <div>
              <p class="text-sm font-semibold text-gray-800">New notification</p>

              <p class="text-xs text-gray-400">But... where is the page? 👀</p>
            </div>
          </div>
        </div>

        <!-- ================= PHONE ================= -->
        <div class="phone-float relative z-10">
          <!-- Phone -->
          <div
            class="relative h-107.5 w-61.25 rotate-[-5deg] rounded-[35px] border-[7px] border-gray-800 bg-white shadow-2xl shadow-main-color/20"
          >
            <!-- Notch -->
            <div
              class="absolute left-1/2 top-0 z-20 h-6 w-24 -translate-x-1/2 rounded-b-2xl bg-gray-800"
            ></div>

            <!-- Screen -->
            <div class="absolute inset-2 overflow-hidden rounded-[27px] bg-main-color/5">
              <!-- App Header -->
              <div
                class="flex items-center justify-between border-b border-main-color/10 bg-white px-4 py-4"
              >
                <div class="flex items-center gap-2">
                  <div
                    class="flex h-8 w-8 items-center justify-center rounded-lg bg-main-color text-white"
                  >
                    <span class="font-bold">S</span>
                  </div>

                  <span class="text-sm font-bold text-main-color"> Socia </span>
                </div>

                <i class="fa-regular fa-bell text-main-color"></i>
              </div>

              <!-- Broken Post -->
              <div class="px-3 pt-5">
                <div class="rounded-2xl bg-white p-3 shadow-md">
                  <!-- Fake user -->
                  <div class="flex items-center gap-2">
                    <div class="h-8 w-8 rounded-full bg-third-color/30"></div>

                    <div class="flex-1">
                      <div class="h-2.5 w-20 rounded-full bg-gray-200"></div>

                      <div class="mt-1.5 h-2 w-12 rounded-full bg-gray-100"></div>
                    </div>
                  </div>

                  <!-- Broken image -->
                  <div
                    class="broken-image mt-4 flex h-36 items-center justify-center rounded-xl bg-main-color/5"
                  >
                    <div class="text-center">
                      <div
                        class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-main-color/10 text-main-color"
                      >
                        <i class="fa-regular fa-image text-2xl"></i>
                      </div>

                      <p class="mt-2 text-xs font-semibold text-main-color">Post not found</p>
                    </div>
                  </div>

                  <!-- Fake actions -->
                  <div class="mt-3 flex items-center justify-between text-gray-300">
                    <div class="flex gap-4">
                      <i class="fa-regular fa-heart"></i>
                      <i class="fa-regular fa-comment"></i>
                      <i class="fa-solid fa-share-nodes"></i>
                    </div>

                    <i class="fa-regular fa-bookmark"></i>
                  </div>
                </div>

                <!-- Fake lines -->
                <div class="mt-5 space-y-2 px-2">
                  <div class="h-2.5 w-full rounded-full bg-main-color/10"></div>

                  <div class="h-2.5 w-4/5 rounded-full bg-main-color/5"></div>

                  <div class="h-2.5 w-3/5 rounded-full bg-main-color/5"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Floating paper plane -->
          <div
            class="plane-float absolute -right-14 top-20 flex h-16 w-16 rotate-12 items-center justify-center rounded-2xl bg-main-color text-white shadow-xl shadow-main-color/20"
          >
            <i class="fa-solid fa-paper-plane text-xl"></i>
          </div>

          <!-- Floating heart -->
          <div
            class="heart-float absolute -left-16 bottom-24 flex h-12 w-12 rotate-[-15deg] items-center justify-center rounded-full bg-white text-main-color shadow-lg"
          >
            <i class="fa-solid fa-heart"></i>
          </div>
        </div>

        <!-- Decorative rings -->
        <div
          class="absolute bottom-3 left-3 h-16 w-16 rounded-full border-2 border-main-color/20"
        ></div>

        <div
          class="absolute right-5 bottom-14 h-8 w-8 rounded-full border-2 border-third-color/30"
        ></div>
      </div>
    </div>
  </div>
</section>
